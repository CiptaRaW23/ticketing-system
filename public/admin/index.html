<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - JagoDesk</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>

  <script>
    const token = localStorage.getItem('adminToken');

    if (!token) {
      window.location.replace('/login.html');
    }
  </script>

  <!-- Mobile Hamburger -->
  <div class="hamburger-mobile" id="hamburger-mobile" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <img src="/logo.png" style="height:36px;object-fit:contain;filter:brightness(0) invert(1);" />
        <span>JagoDesk</span>
      </div>
    </div>
    <div class="menu-section">
      <div class="menu-item active" data-page="monitoring">
        <i class="fas fa-chart-bar"></i> Monitoring
      </div>
      <div class="menu-item" data-page="tickets">
        <i class="fas fa-ticket-alt"></i> List Ticket
      </div>
      <div class="menu-item" data-page="customers">
        <i class="fas fa-users"></i> Kelola Customer
      </div>
      <div class="menu-item" data-page="technicians">
        <i class="fas fa-hard-hat"></i> Kelola Teknisi
      </div>
    </div>
    <div class="logout-section">
      <button class="logout-btn" id="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="main-content">
    <div id="page-container">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i> Memuat halaman...
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="notification" id="notification" style="display:none;">
    <i class="fas fa-bell"></i> <span id="notification-text">Notifikasi</span>
  </div>

  <!-- Audio -->
  <audio id="notif-sound" preload="none">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" type="audio/mpeg">
  </audio>

  <!-- Socket.IO & Chart.js (global, bukan module) -->
  <script>
    function loadSocketIOFallback() {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js';
      document.head.appendChild(s);
    }
  </script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" onerror="loadSocketIOFallback()"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

  <!-- Komponen global (IIFE, bukan module) -->
  <script src="components/auth.js"></script>
  <script src="components/sidebar.js"></script>

  <!-- App router (ES Module) -->
  <script src="js/admin-app.js" type="module"></script>

</body>
</html>
