<!-- pages/customers.html -->
<div class="dashboard-header">
  <h2>
    <i class="fas fa-users"></i> Manajemen Pelanggan
  </h2>
  <div class="header-actions">
    <button class="btn btn-success" id="cust-bulkApproveBtn" disabled>
      <i class="fas fa-check-circle"></i> Aktifkan Selected (0)
    </button>
    <button class="btn btn-danger" id="cust-bulkDeleteBtn" disabled>
      <i class="fas fa-trash"></i> Nonaktifkan Selected (0)
    </button>
    <button class="btn btn-success" onclick="CustomersPage.openAddModal()">
      <i class="fas fa-plus"></i> Tambah Pelanggan Baru
    </button>
    <button class="btn btn-refresh" onclick="CustomersPage.refresh()">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
    <div class="user-badge">
      <div class="user-avatar-small">A</div>
      <span><strong class="admin-name">Admin</strong></span>
    </div>
  </div>
</div>

<div class="dashboard-content">
  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="stat-card blue">
      <h3>Total Pelanggan</h3>
      <div class="value" id="cust-stat-total-customers">0</div>
      <div class="trend info">
        <i class="fas fa-users"></i> Semua pelanggan
      </div>
    </div>
    
    <div class="stat-card green">
      <h3>Aktif</h3>
      <div class="value" id="cust-stat-active-customers">0</div>
      <div class="trend up">
        <i class="fas fa-check-circle"></i> Pelanggan aktif
      </div>
    </div>
    
    <div class="stat-card orange">
      <h3>Pending</h3>
      <div class="value" id="cust-stat-pending-customers">0</div>
      <div class="trend warning">
        <i class="fas fa-clock"></i> Belum ada
      </div>
    </div>
    
    <div class="stat-card red">
      <h3>Nonaktif</h3>
      <div class="value" id="cust-stat-inactive-customers">0</div>
      <div class="trend down">
        <i class="fas fa-user-slash"></i> Tidak aktif
      </div>
    </div>
  </div>

  <!-- Table Customer -->
  <div class="table-container">
    <div class="table-header">
      <h3><i class="fas fa-list"></i> Daftar Pelanggan</h3>
      <div class="search-box">
        <input
          type="text"
          id="cust-customerSearch"
          placeholder="🔍 Cari nama / ID / username..."
        />
      </div>
    </div>

    <table id="cust-customerTable">
      <thead>
        <tr>
          <th style="width: 50px;">
            <input type="checkbox" id="cust-selectAllCustomers" />
          </th>
          <th>ID</th>
          <th>Username</th>
          <th>Nama</th>
          <th>Alamat</th>
          <th>Status</th>
          <th>Tanggal Daftar</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="cust-customerTableBody">
        <tr>
          <td colspan="8" style="text-align: center; padding: 60px 20px; color: var(--gray);">
            <i class="fas fa-spinner fa-spin" style="font-size: 48px; opacity: 0.3; margin-bottom: 16px; display: block;"></i>
            Memuat data pelanggan...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Tambah Customer -->
<div class="modal-overlay" id="cust-addCustomerModal">
  <div class="modal-content" style="max-width: 500px;">
    <div class="modal-header">
      <h2><i class="fas fa-user-plus"></i> Tambah Pelanggan Baru</h2>
      <span class="modal-close" onclick="CustomersPage.closeAddModal()">&times;</span>
    </div>
    <div class="modal-body">
      <input 
        type="text" 
        id="cust-new-username" 
        class="input-field" 
        placeholder="Username (unik, contoh: budi123)"
        autocomplete="off"
      />
      <input 
        type="text" 
        id="cust-new-name" 
        class="input-field" 
        placeholder="Nama Lengkap (contoh: Budi Santoso)"
      />
      <input 
        type="password" 
        id="cust-new-password" 
        class="input-field" 
        placeholder="Password (minimal 6 karakter)"
      />
      <input 
        type="text" 
        id="cust-new-address" 
        class="input-field" 
        placeholder="Alamat Lengkap (opsional, untuk Google Maps)"
      />
      <button class="btn btn-success" onclick="CustomersPage.addCustomer()" style="width: 100%; padding: 14px; margin-top: 10px;">
        <i class="fas fa-save"></i> Simpan Pelanggan
      </button>
      <p class="error" id="cust-customer-error" style="margin-top: 15px;"></p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  // ============================================
  // PRIVATE VARIABLES
  // ============================================
  let allCustomers = [];
  let selectedCustomers = new Set();
  let eventListenersAttached = false;

  // ============================================
  // PRIVATE FUNCTIONS
  // ============================================
  
  async function loadCustomers() {
    const tbody = document.getElementById('cust-customerTableBody');
    if (!tbody) return;
    
    tbody.innerHTML = `
      <tr>
        <td colspan="8" style="text-align: center; padding: 60px 20px; color: var(--gray);">
          <i class="fas fa-spinner fa-spin" style="font-size: 48px; opacity: 0.3; margin-bottom: 16px; display: block;"></i>
          Memuat data pelanggan...
        </td>
      </tr>
    `;

    try {
      const res = await fetch(`${window.API_BASE}/api/customers`, {
        headers: window.getAuthHeaders(),
        cache: 'no-cache'
      });

      if (!res.ok) {
        const errorText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errorText}`);
      }

      allCustomers = await res.json();
      console.log('[Customers] ✅ Loaded:', allCustomers.length, 'customers');
      renderCustomers(allCustomers);
      updateStats();
    } catch (error) {
      console.error('[Customers] ❌ Error loading:', error);
      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="text-align: center; padding: 60px 20px; color: var(--danger);">
            <i class="fas fa-exclamation-triangle" style="font-size: 48px; opacity: 0.3; margin-bottom: 16px; display: block;"></i>
            <p style="font-size: 16px; font-weight: 500;">Gagal memuat data pelanggan</p>
            <p style="font-size: 14px; opacity: 0.7; margin-top: 8px;">${error.message}</p>
            <button onclick="CustomersPage.refresh()" class="btn btn-success" style="margin-top: 20px;">
              <i class="fas fa-sync-alt"></i> Coba Lagi
            </button>
          </td>
        </tr>
      `;
    }
  }

  function renderCustomers(customers) {
    const tbody = document.getElementById('cust-customerTableBody');
    if (!tbody) return;
    
    if (customers.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="text-align: center; padding: 60px 20px; color: var(--gray);">
            <i class="fas fa-users" style="font-size: 64px; opacity: 0.2; margin-bottom: 16px; display: block;"></i>
            <p style="font-size: 16px; font-weight: 500;">Belum ada pelanggan terdaftar</p>
            <p style="font-size: 14px; opacity: 0.7; margin-top: 8px;">Klik "Tambah Pelanggan Baru" untuk memulai</p>
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = customers.map(customer => {
      const statusBadge = customer.status === 'active' ? 'badge-success' : 'badge-danger';
      const statusText = customer.status === 'active' ? 'Aktif' : 'Nonaktif';
      const dateFormatted = new Date(customer.createdAt).toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });

      return `
        <tr data-status="${customer.status}" data-id="${customer.id}">
          <td>
            <input type="checkbox" class="cust-customer-check" data-id="${customer.id}" />
          </td>
          <td><strong>CUS-${customer.id}</strong></td>
          <td>${customer.username}</td>
          <td>${customer.name}</td>
          <td>${customer.address || '<span style="color: var(--gray); font-style: italic;">Belum diisi</span>'}</td>
          <td>
            <span class="badge ${statusBadge}">
              ${statusText}
            </span>
          </td>
          <td>${dateFormatted}</td>
          <td class="action-btns">
            ${customer.status === 'inactive' ? 
              `<button class="btn-sm btn-approve" onclick="CustomersPage.activate(${customer.id})">
                <i class="fas fa-check"></i> Aktifkan
              </button>` : 
              `<button class="btn-sm btn-edit" onclick="CustomersPage.deactivate(${customer.id})">
                <i class="fas fa-ban"></i> Nonaktifkan
              </button>`
            }
          </td>
        </tr>
      `;
    }).join('');

    attachCheckboxListeners();
  }

  function updateStats() {
    const total = allCustomers.length;
    const active = allCustomers.filter(c => c.status === 'active').length;
    const inactive = allCustomers.filter(c => c.status === 'inactive').length;
    const pending = 0;

    const elTotal = document.getElementById('cust-stat-total-customers');
    const elActive = document.getElementById('cust-stat-active-customers');
    const elPending = document.getElementById('cust-stat-pending-customers');
    const elInactive = document.getElementById('cust-stat-inactive-customers');

    if (elTotal) elTotal.textContent = total;
    if (elActive) elActive.textContent = active;
    if (elPending) elPending.textContent = pending;
    if (elInactive) elInactive.textContent = inactive;

    console.log('[Customers] Stats updated:', { total, active, inactive });
  }

  function attachCheckboxListeners() {
    document.querySelectorAll('.cust-customer-check').forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const customerId = this.dataset.id;
        if (this.checked) {
          selectedCustomers.add(customerId);
        } else {
          selectedCustomers.delete(customerId);
        }
        updateBulkButtons();
      });
    });
  }

  function updateBulkButtons() {
    const count = selectedCustomers.size;
    const approveBtn = document.getElementById('cust-bulkApproveBtn');
    const deleteBtn = document.getElementById('cust-bulkDeleteBtn');
    
    if (approveBtn) {
      approveBtn.innerHTML = `<i class="fas fa-check-circle"></i> Aktifkan Selected (${count})`;
      approveBtn.disabled = count === 0;
    }
    
    if (deleteBtn) {
      deleteBtn.innerHTML = `<i class="fas fa-ban"></i> Nonaktifkan Selected (${count})`;
      deleteBtn.disabled = count === 0;
    }
  }

  function setupEventListeners() {
    if (eventListenersAttached) return;
    
    const selectAll = document.getElementById('cust-selectAllCustomers');
    if (selectAll) {
      selectAll.addEventListener('change', function() {
        const checkboxes = document.querySelectorAll('.cust-customer-check');
        checkboxes.forEach(cb => {
          cb.checked = this.checked;
          const customerId = cb.dataset.id;
          if (this.checked) {
            selectedCustomers.add(customerId);
          } else {
            selectedCustomers.delete(customerId);
          }
        });
        updateBulkButtons();
      });
    }

    const searchInput = document.getElementById('cust-customerSearch');
    if (searchInput) {
      searchInput.addEventListener('input', filterCustomers);
    }

    const bulkApproveBtn = document.getElementById('cust-bulkApproveBtn');
    if (bulkApproveBtn) {
      bulkApproveBtn.addEventListener('click', bulkActivateCustomers);
    }

    const bulkDeleteBtn = document.getElementById('cust-bulkDeleteBtn');
    if (bulkDeleteBtn) {
      bulkDeleteBtn.addEventListener('click', bulkDeactivateCustomers);
    }

    // ESC key to close modal
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeAddModal();
      }
    });

    // Click outside to close modal
    const modal = document.getElementById('cust-addCustomerModal');
    if (modal) {
      modal.addEventListener('click', function(e) {
        if (e.target === this) {
          closeAddModal();
        }
      });
    }

    eventListenersAttached = true;
  }

  function filterCustomers() {
    const searchTerm = document.getElementById('cust-customerSearch').value.toLowerCase();
    let filtered = allCustomers;

    if (searchTerm) {
      filtered = filtered.filter(customer =>
        customer.id.toString().includes(searchTerm) ||
        customer.username.toLowerCase().includes(searchTerm) ||
        customer.name.toLowerCase().includes(searchTerm) ||
        (customer.address && customer.address.toLowerCase().includes(searchTerm))
      );
    }

    renderCustomers(filtered);
  }

  function openAddModal() {
    const modal = document.getElementById('cust-addCustomerModal');
    if (!modal) return;
    
    modal.classList.add('active');
    
    // Reset form
    document.getElementById('cust-new-username').value = '';
    document.getElementById('cust-new-name').value = '';
    document.getElementById('cust-new-password').value = '';
    document.getElementById('cust-new-address').value = '';
    document.getElementById('cust-customer-error').textContent = '';
    
    setTimeout(() => document.getElementById('cust-new-username').focus(), 100);
  }

  function closeAddModal() {
    const modal = document.getElementById('cust-addCustomerModal');
    if (modal) modal.classList.remove('active');
  }

  async function addCustomer() {
    const username = document.getElementById('cust-new-username').value.trim();
    const name = document.getElementById('cust-new-name').value.trim();
    const password = document.getElementById('cust-new-password').value;
    const address = document.getElementById('cust-new-address').value.trim();
    const errorEl = document.getElementById('cust-customer-error');

    errorEl.textContent = '';

    if (!username || !name || !password) {
      errorEl.textContent = '⚠️ Username, nama, dan password wajib diisi!';
      return;
    }

    if (password.length < 6) {
      errorEl.textContent = '⚠️ Password minimal 6 karakter!';
      return;
    }

    try {
      const res = await fetch(`${window.API_BASE}/api/register`, {
        method: 'POST',
        headers: window.getAuthHeaders(),
        body: JSON.stringify({
          username,
          name,
          password,
          address: address || null
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Gagal menambah pelanggan');
      }

      closeAddModal();
      alert(`✅ Pelanggan "${name}" berhasil ditambahkan!`);
      await loadCustomers();
    } catch (error) {
      console.error('[Customers] Error adding:', error);
      errorEl.textContent = `❌ ${error.message}`;
    }
  }

  async function activateCustomer(id) {
    if (!confirm(`✅ Aktifkan customer ID ${id}?`)) return;

    try {
      const res = await fetch(`${window.API_BASE}/api/customers/${id}`, {
        method: 'PATCH',
        headers: window.getAuthHeaders(),
        body: JSON.stringify({ status: 'active' })
      });

      if (!res.ok) {
        const error = await res.json();
        throw new Error(error.error || 'Gagal mengaktifkan customer');
      }

      alert(`✅ Customer ${id} berhasil diaktifkan!`);
      await loadCustomers();
    } catch (error) {
      console.error('[Customers] Error activating:', error);
      alert(`❌ ${error.message}`);
    }
  }

  async function deactivateCustomer(id) {
    if (!confirm(`⚠️ Nonaktifkan customer ID ${id}?`)) return;

    try {
      const res = await fetch(`${window.API_BASE}/api/customers/${id}`, {
        method: 'PATCH',
        headers: window.getAuthHeaders(),
        body: JSON.stringify({ status: 'inactive' })
      });

      if (!res.ok) {
        const error = await res.json();
        throw new Error(error.error || 'Gagal menonaktifkan customer');
      }

      alert(`✅ Customer ${id} berhasil dinonaktifkan!`);
      await loadCustomers();
    } catch (error) {
      console.error('[Customers] Error deactivating:', error);
      alert(`❌ ${error.message}`);
    }
  }

  async function bulkActivateCustomers() {
    if (selectedCustomers.size === 0) return;
    
    if (!confirm(`✅ Aktifkan ${selectedCustomers.size} customer terpilih?`)) return;

    let success = 0;
    let failed = 0;

    for (const id of selectedCustomers) {
      try {
        const res = await fetch(`${window.API_BASE}/api/customers/${id}`, {
          method: 'PATCH',
          headers: window.getAuthHeaders(),
          body: JSON.stringify({ status: 'active' })
        });
        
        if (res.ok) success++;
        else failed++;
      } catch {
        failed++;
      }
    }

    alert(`✅ ${success} customer berhasil diaktifkan${failed > 0 ? `, ${failed} gagal` : ''}`);
    
    selectedCustomers.clear();
    document.getElementById('cust-selectAllCustomers').checked = false;
    updateBulkButtons();
    await loadCustomers();
  }

  async function bulkDeactivateCustomers() {
    if (selectedCustomers.size === 0) return;
    
    if (!confirm(`⚠️ Nonaktifkan ${selectedCustomers.size} customer terpilih?`)) return;

    let success = 0;
    let failed = 0;

    for (const id of selectedCustomers) {
      try {
        const res = await fetch(`${window.API_BASE}/api/customers/${id}`, {
          method: 'PATCH',
          headers: window.getAuthHeaders(),
          body: JSON.stringify({ status: 'inactive' })
        });
        
        if (res.ok) success++;
        else failed++;
      } catch {
        failed++;
      }
    }

    alert(`✅ ${success} customer berhasil dinonaktifkan${failed > 0 ? `, ${failed} gagal` : ''}`);
    
    selectedCustomers.clear();
    document.getElementById('cust-selectAllCustomers').checked = false;
    updateBulkButtons();
    await loadCustomers();
  }

  // ============================================
  // PUBLIC API
  // ============================================
  window.CustomersPage = {
    init: function() {
      console.log('[Customers] 🚀 Initializing page...');
      loadCustomers();
      setupEventListeners();
    },
    
    refresh: loadCustomers,
    
    openAddModal: openAddModal,
    
    closeAddModal: closeAddModal,
    
    addCustomer: addCustomer,
    
    activate: activateCustomer,
    
    deactivate: deactivateCustomer
  };

})();
</script>
